# timer-nicolau-firmware: run the packaged build. Any ExecStartPre/ExecStart of the base unit is
# replaced; sounds live in /var/lib/timer-nicolau (timer-nicolau-system).
#
# The game draws on VT2, so boot text and the login prompt on VT1 are never on the TV; when it
# stops (Esc, `timer-maintenance on`) the console on VT1 comes back.
[Service]
ExecStartPre=
ExecStart=
ExecStart=/usr/lib/timer-nicolau/timer-sdl
ExecStartPre=-/usr/bin/chvt 2
ExecStopPost=-/usr/bin/chvt 1
