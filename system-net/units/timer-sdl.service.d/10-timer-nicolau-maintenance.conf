# Maintenance mode: while either flag exists timer-sdl does not start (at boot or on any restart),
# leaving HDMI and keyboard to the console. timer-sdl restarts itself 5 s after Esc, which made the
# console unusable for maintenance on 2026-10-23.
#   /etc/timer-sdl/maintenance        persistent: `sudo timer-maintenance on|off`
#   /run/timer-nicolau/maintenance    this boot only: a MANUTENCAO file on the SD card
[Unit]
ConditionPathExists=!/etc/timer-sdl/maintenance
ConditionPathExists=!/run/timer-nicolau/maintenance
