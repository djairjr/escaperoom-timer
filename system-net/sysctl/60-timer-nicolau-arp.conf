# Timer-Nicolau: each interface answers ARP only for its own address, and announces with it.
#
# end0 and wlan1 can sit on the same subnet for a few seconds (a Wi-Fi password is validated
# while the cable is in). With the kernel defaults the board answers ARP for both addresses on
# both interfaces ("ARP flux"); a consumer router was seen learning the board
# through the wrong MAC and one of its radios lost the board for good, until the router rebooted.
net.ipv4.conf.all.arp_ignore = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.default.arp_ignore = 1
net.ipv4.conf.default.arp_announce = 2
