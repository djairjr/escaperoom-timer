# Timer-Nicolau network and SD-card settings. Uncomment to change a default.
# Read by the tools in /usr/lib/timer-nicolau (defaults in common.sh there).

# Interfaces. On the Orange Pi PC Plus the rtl8189fs radio exposes wlan0 and wlan1 together.
#ETH_IFACE=end0           # while it has carrier the Wi-Fi client stays down
#AP_IFACE=wlan0
#CLIENT_IFACE=wlan1        # also change /usr/lib/systemd/network/30-timer-wifi-client.network

# Configuration access point: SSID is "<AP_PREFIX>-XXXX" (last 4 hex digits of the AP MAC).
#AP_PREFIX=Nicolau
#AP_ADDR=192.168.4.1
#AP_CHANNEL=6
# Empty = the web configurator login password (http_password in setup.json).
#AP_PASSPHRASE=

# Seconds, at boot without a cable, to wait for the saved Wi-Fi before the access point comes up.
# With the cable plugged in the access point comes up at once.
#BOOT_WAIT=20
